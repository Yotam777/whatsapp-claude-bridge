# TrueNAS → Apps → Discover Apps → ⋮ → Install via YAML. Name: whatsapp-claude
# Before installing: create the dataset Yotam-Storage/whatsapp-claude and copy the export from the PC into it
# (see docker/README.he.md). Replace PASTE-TOKEN-HERE with the output of `claude setup-token`.
services:
  whatsapp-claude:
    image: ghcr.io/yotam777/whatsapp-claude-bridge:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: PASTE-TOKEN-HERE
      TZ: Asia/Jerusalem
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /mnt/Yotam-Storage/whatsapp-claude:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
